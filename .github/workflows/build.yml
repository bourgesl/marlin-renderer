name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (Maven)
        run: |
          mvn verify
          echo "That's All, folks !"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: marlin-build
          path: target/marlin-*.jar

